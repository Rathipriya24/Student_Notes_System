<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

   <div class="dashboard-container">

    <h1>📚 Student Notes Sharing System</h1>

    <h2>Welcome, {{ session["student_name"] }}! 👋</h2>

    <div class="dashboard-cards">

        <div class="dashboard-card">
            <h3>📤 Upload Notes</h3>
            <p>Share your study materials with other students.</p>
            <a href="/upload">Upload Notes</a>
        </div>

        <div class="dashboard-card">
            <h3>📚 View Notes</h3>
            <p>View and download available study materials.</p>
            <a href="/view_notes">View Notes</a>
        </div>

        <div class="dashboard-card">
            <h3>🚪 Logout</h3>
            <p>Logout from your student account.</p>
            <a href="/logout">Logout</a>
        </div>

    </div>

   </div>
</body>
</html>
